services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: prometheus:local
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /home/prometheus/database.sqlite
    volumes:
      - ./.docker-db:/home/prometheus
